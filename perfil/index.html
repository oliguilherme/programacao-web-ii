<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="pagina">
    <article class="card-perfil">
      <img class="card-perfil__foto" src="" alt="Foto de perfil" />
      <h1 class="card-perfil__nome"></h1>
      <p class="card-perfil__cargo"></p>

      <section class="card-perfil__bio">
        <p></p>
      </section>

      <section class="card-perfil__redes">
        <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
        <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
      </section>

      <div class="card-perfil__acoes">
        <button class="card-perfil__follow">Follow</button>
        <button class="card-perfil__unfollow">Unfollow</button>
      </div>
      <p class="card-perfil__contador"></p>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
