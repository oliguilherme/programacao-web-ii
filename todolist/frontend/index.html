<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-container">
        <h1>TodoList</h1>
        <p>Bom dia, <b>Guilherme</b></p>
      </div>
    </header>
    <main>
      <section class="add-task">
        <h2>Adicionar Tarefa</h2>
        <form action="">
          <input type="text" placeholder="Escreva aqui sua tarefa" class="task-input">
          <button type="submit">Adicionar</button>
        </form>
      </section>
      <section class="tasks">
        <div class="header-tasks">
          <div>
            <h2>Minhas tarefas</h2>
            <p>Veja todas as suas tarefas criadas na plataforma</p>
          </div>
          <p>10 de 20 concluídas</p>
        </div>
        <ul class="task-list"></ul>
        <template class="task-template">
          <li class="task">
            <input type="checkbox">
            <div class="task-info">
              <p class="task-name"></p>
              <small class="task-date"></small>
            </div>
            <button class="delete-task">deletar</button>
          </li>
        </template>
      </section>
    </main>
  </div>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
